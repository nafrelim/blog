services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  blog_be:
    build:
      context: .
    env_file:
      - .env
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "${BE_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  blog_fe:
    build:
      context: ../blog_fe
    environment:
      BLOG_API_URL: ${BLOG_API_URL:-http://localhost:8000}
      PORT: "8080"
    ports:
      - "${FE_PORT:-8080}:8080"
    depends_on:
      - blog_be

volumes:
  postgres_data:
